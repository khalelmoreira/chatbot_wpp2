name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: pyright
        continue-on-error: true # report-only for now: 34 pre-existing errors to work through before this blocks merges

      - name: Test (pytest)
        run: pytest --cov=src --cov-report=term-missing
