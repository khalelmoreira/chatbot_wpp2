[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-wpp2"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/tests/fixtures/templates/sample_msg.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# AI prompt text and SQL DDL are inherently long; wrapping hurts readability more than it helps.
"src/models/prompts/*.py" = ["E501"]
"src/database/tables_db.py" = ["E501"]
"src/tests/generators/gen_msg_ai.py" = ["E501"]

[tool.pyright]
include = ["src", "app.py", "config.py"]
exclude = ["**/__pycache__", "src/tests/fixtures/templates/sample_msg.py"]
typeCheckingMode = "basic"